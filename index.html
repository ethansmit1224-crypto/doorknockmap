<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Knock Log">
<title>Knock Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* Layout idea: one-screen field tool. Slim header with place search, the live map fills the middle, thumb-reach tabs at the bottom, a bottom sheet for each door. */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --ink:#13262B; --muted:#5D6E72; --line:#D5DCDB;
  --accent:#0F4C5C; --on-accent:#FFFFFF; --accent-soft:#E2EDEE;
  --s-none:#7F8B8E; --s-noanswer:#C77700; --s-notint:#C2372C; --s-interested:#23803F;
  --s-callback:#2463D1; --s-sold:#7438B8; --s-dnk:#1A1A1A;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --shadow:0 6px 24px rgba(10,30,35,.22);
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#0E1719; --surface:#17252A; --ink:#E9F0EF; --muted:#9BABAD; --line:#2C3F44;
    --accent:#7CC6D4; --on-accent:#06242B; --accent-soft:#1F3338;
    --s-none:#8A979A; --s-noanswer:#E39A22; --s-notint:#E3574B; --s-interested:#3DAA5E;
    --s-callback:#5B8FF0; --s-sold:#A070E0; --s-dnk:#000000;
    --shadow:0 6px 24px rgba(0,0,0,.55);
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--s-callback);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;background:var(--bg)}

header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
#find{flex:1;min-width:0;display:flex;gap:6px}
#findq{flex:1;min-width:0;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 10px}
.iconbtn{height:40px;min-width:40px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:600}

main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:flex;flex-direction:column}
.view[hidden]{display:none}
.legend{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;flex:none;background:var(--bg)}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:17px;background:var(--surface);font-size:14px;font-weight:500;white-space:nowrap;flex:none}
.chip .sw{width:12px;height:12px;border-radius:50%;flex:none}
.chip .n{color:var(--muted);font-variant-numeric:tabular-nums}
.chip.off{opacity:.45;text-decoration:line-through}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chip.on .n{color:inherit;opacity:.8}

#mapbox{flex:1;min-height:0;position:relative}
#map{position:absolute;inset:0;background:var(--line);font-family:var(--body)}
.leaflet-container{cursor:crosshair}
.pin{position:relative;width:30px;height:30px;border-radius:50%;border:2.5px solid #fff;color:#fff;font-weight:700;font-size:15px;line-height:1;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.5);cursor:pointer}
.pin small{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:2px;font-size:11px;font-weight:600;color:#13262B;background:#fff;border-radius:4px;padding:0 4px;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.35)}
.pin.draft{background:rgba(255,255,255,.35);border:3px dashed #13262B;box-shadow:none;animation:pulse 1s ease-in-out infinite alternate}
.pin.due{outline:3px solid var(--s-callback);outline-offset:2px}
@keyframes pulse{to{transform:scale(1.25)}}
@media (prefers-reduced-motion: reduce){.pin.draft{animation:none}}
.s-none{background:var(--s-none)} .s-noanswer{background:var(--s-noanswer)} .s-notint{background:var(--s-notint)}
.s-interested{background:var(--s-interested)} .s-callback{background:var(--s-callback)} .s-sold{background:var(--s-sold)} .s-dnk{background:var(--s-dnk)}
.me{width:18px;height:18px;border-radius:50%;background:#1A73E8;border:3px solid #fff;box-shadow:0 0 0 2px rgba(26,115,232,.35),0 1px 4px rgba(0,0,0,.4)}
.fabs{position:absolute;right:12px;bottom:24px;display:flex;flex-direction:column;gap:8px;z-index:500;align-items:flex-end}
.fab{height:48px;min-width:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;box-shadow:var(--shadow)}
.fab.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.hint{position:absolute;left:12px;bottom:24px;z-index:500;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--muted);box-shadow:var(--shadow);max-width:55%}

.scroll{flex:1;min-height:0;overflow-y:auto;padding:0 12px 16px}
.wrap{max-width:760px;margin:0 auto;width:100%}
.toolbar{display:flex;gap:8px;padding:10px 12px 0}
.toolbar input{flex:1;min-width:0;height:42px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 12px}
.row{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px;margin-top:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.row .badge{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700}
.row .t{font-weight:600}
.row .m{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.row .due{color:var(--s-callback);font-weight:600}
.row .body{flex:1;min-width:0}
.empty{margin:40px auto;padding:0 16px;text-align:center;color:var(--muted);max-width:420px}
.empty h2{font-family:var(--display);font-size:26px;color:var(--ink);margin:0 0 6px;text-wrap:balance}
h3.sec{font-family:var(--display);font-size:18px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:18px 0 6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.tile .v{font-family:var(--display);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tile .l{font-size:13px;color:var(--muted);margin-top:4px}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:118px 1fr 36px;gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;border-radius:7px;background:var(--accent-soft);overflow:hidden}
.bar .fill{display:block;height:100%;border-radius:7px;min-width:2px}
.bar .c{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:130px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.week .d{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;font-size:12px;color:var(--muted)}
.week .col{width:70%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.week .num{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:10px}
.card h2{font-family:var(--display);font-size:22px;margin:0 0 4px}
.card p{margin:0 0 10px;color:var(--muted);font-size:15px;max-width:65ch}
.card .actions{margin-top:0}
.warn{border-left:4px solid var(--s-noanswer)}

nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);flex:none}
nav button{height:54px;border:0;background:none;font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-top:3px solid transparent}
nav button[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}

#scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .15s;z-index:2000}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:760px;margin:0 auto;max-height:86%;overflow-y:auto;background:var(--surface);border-radius:16px 16px 0 0;box-shadow:var(--shadow);padding:14px 16px 20px;transform:translateY(105%);transition:transform .18s ease-out;z-index:2001}
body.sheet-open #scrim{opacity:1;pointer-events:auto}
body.sheet-open #sheet{transform:none}
@media (prefers-reduced-motion: reduce){#sheet,#scrim{transition:none}}
.sh-head{display:flex;align-items:flex-start;gap:10px}
.sh-head h2{font-family:var(--display);font-size:26px;line-height:1.1;margin:0;overflow-wrap:anywhere;text-wrap:balance}
.sh-sub{font-size:14px;color:var(--muted);margin:2px 0 0}
.grp{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px}
.sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.sbtn{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 12px;border:2px solid var(--line);border-radius:10px;background:var(--surface);font-weight:600;text-align:left}
.sbtn .g{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700}
.sbtn[aria-pressed="true"]{border-color:var(--ink);background:var(--accent-soft)}
.sbtn.wide{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field textarea{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:10px 12px;min-height:44px;width:100%}
.field textarea{min-height:76px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
.hist{list-style:none;margin:0;padding:0;font-size:14px}
.hist li{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}
.hist .sw{width:10px;height:10px;border-radius:50%;flex:none}
.hist time{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn{min-height:48px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);flex:1}
.btn.danger{color:var(--s-notint)}
.btn.danger.armed{background:var(--s-notint);color:#fff;border-color:var(--s-notint)}
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:14px;z-index:3000;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">Knock Log</div>
    <form id="find" role="search">
      <input id="findq" type="search" placeholder="Go to a street or city" aria-label="Go to a street or city" autocomplete="off">
      <button class="iconbtn" type="submit">Go</button>
    </form>
  </header>
  <main>
    <section class="view" id="v-map">
      <div class="legend" id="legend"></div>
      <div id="mapbox">
        <div id="map"></div>
        <div class="hint" id="hint">Tap a house to drop a pin.</div>
        <div class="fabs">
          <button class="fab" data-act="layer" id="layerBtn">Satellite</button>
          <button class="fab" data-act="locate" aria-label="Go to my location">My location</button>
          <button class="fab primary" data-act="pin-here">Pin where I am</button>
        </div>
      </div>
    </section>
    <section class="view" id="v-doors" hidden></section>
    <section class="view" id="v-stats" hidden></section>
    <section class="view" id="v-backup" hidden></section>
  </main>
  <nav>
    <button data-view="map" aria-current="page">Map</button>
    <button data-view="doors">Doors</button>
    <button data-view="stats">Stats</button>
    <button data-view="backup">Backup</button>
  </nav>
</div>
<div id="scrim" data-act="sheet-close"></div>
<section id="sheet" role="dialog" aria-modal="true" aria-label="Door details"></section>
<div id="toast" role="status"></div>
<input id="restoreFile" type="file" accept="application/json,.json" hidden>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";
const STATUS = [
  {k:'none',       label:'Not knocked',    g:'·'},
  {k:'noanswer',   label:'No answer',      g:'–'},
  {k:'notint',     label:'Not interested', g:'✕'},
  {k:'interested', label:'Interested',     g:'★'},
  {k:'callback',   label:'Come back',      g:'↻'},
  {k:'sold',       label:'Sold',           g:'$'},
  {k:'dnk',        label:'Do not knock',   g:'!'}
];
const ST = Object.fromEntries(STATUS.map(s => [s.k, s]));
const ANSWERED = new Set(['notint','interested','callback','sold']);
const KNOCK = new Set(['noanswer','notint','interested','callback','sold']);
const LS = {doors:'knocklog-live-doors', view:'knocklog-live-view', layer:'knocklog-live-layer', backup:'knocklog-live-backup'};

const S = { doors:[], view:'map', hidden:new Set(), listFilter:'all', q:'', sheet:null, me:null, moved:false, storageOk:true };
let map, pinLayer, draftMarker = null, meMarker = null, meCircle = null, layers = {}, curLayer = 'street';

const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const clone = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2,'0');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const dayKey = t => { const d = new Date(t); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const today = () => dayKey(Date.now());
const fmtWhen = t => { const d = new Date(t), time = d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  return dayKey(t) === today() ? 'Today ' + time : d.toLocaleDateString([], {month:'short', day:'numeric'}) + ' ' + time; };
const fmtDate = k => { if(!k) return ''; const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString([], {weekday:'short', month:'short', day:'numeric'}); };
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 3500); }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k, v){ try{ localStorage.setItem(k, v); return true; }catch(e){ return false; } }

/* ---------- storage: this phone's browser ---------- */
function load(){ try{ const j = JSON.parse(lsGet(LS.doors) || '[]'); if(Array.isArray(j)) S.doors = j.filter(validDoor); }catch(e){ S.doors = []; } }
function save(){ const ok = lsSet(LS.doors, JSON.stringify(S.doors)); if(!ok && S.storageOk) toast("Couldn't save on this phone. Storage is full or blocked. Download a backup now."); S.storageOk = ok; }
function validDoor(d){ return d && typeof d.id === 'string' && isFinite(d.lat) && isFinite(d.lng) && Math.abs(d.lat) <= 90 && Math.abs(d.lng) <= 180; }
function normDoor(d){ return {id:String(d.id), lat:+d.lat, lng:+d.lng, status:ST[d.status] ? d.status : 'none', address:String(d.address||''), name:String(d.name||''), phone:String(d.phone||''),
  notes:String(d.notes||''), follow:/^\d{4}-\d{2}-\d{2}$/.test(d.follow||'') ? d.follow : '', visits:Array.isArray(d.visits) ? d.visits.filter(v => v && isFinite(v.t) && ST[v.s]).map(v => ({t:+v.t, s:v.s})) : [], created:+d.created||Date.now(), updated:+d.updated||Date.now()}; }
function putDoor(d){ d.updated = Date.now(); const i = S.doors.findIndex(x => x.id === d.id); if(i >= 0) S.doors[i] = d; else S.doors.push(d); save(); }
function removeDoor(id){ S.doors = S.doors.filter(x => x.id !== id); save(); }

/* ---------- derived ---------- */
const isDue = d => d.follow && d.follow <= today() && d.status !== 'sold' && d.status !== 'dnk';
const lastVisit = d => d.visits && d.visits.length ? d.visits[d.visits.length-1] : null;
const houseNo = d => { const m = /^\s*(\d+[A-Za-z]?)\b/.exec(d.address || ''); return m ? m[1] : ''; };
function counts(){ const c = {}; STATUS.forEach(s => c[s.k] = 0); S.doors.forEach(d => { c[d.status] = (c[d.status]||0) + 1; }); return c; }

/* ---------- map ---------- */
function initMap(){
  map = L.map('map', {zoomControl:false, maxZoom:21, tap:false});
  L.control.zoom({position:'topright'}).addTo(map);
  layers.street = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:21, maxNativeZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'});
  layers.satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxZoom:21, maxNativeZoom:19, attribution:'Imagery &copy; Esri and its data providers'});
  setLayer(lsGet(LS.layer) === 'satellite' ? 'satellite' : 'street');
  pinLayer = L.layerGroup().addTo(map);
  let v = null; try{ v = JSON.parse(lsGet(LS.view) || 'null'); }catch(e){}
  if(v && isFinite(v.lat) && isFinite(v.lng) && isFinite(v.z)){ map.setView([v.lat, v.lng], v.z); S.moved = true; }
  else if(S.doors.length){ map.fitBounds(L.latLngBounds(S.doors.map(d => [d.lat, d.lng])).pad(0.2), {maxZoom:19}); S.moved = true; }
  else map.setView([39.5, -98.35], 4);
  map.on('moveend', () => { const c = map.getCenter(); lsSet(LS.view, JSON.stringify({lat:c.lat, lng:c.lng, z:map.getZoom()})); });
  map.on('click', e => { if(S.sheet) return;
    if(map.getZoom() < 16){ toast('Zoom in closer to drop a pin on the right house.'); return; }
    newDoor(e.latlng.lat, e.latlng.lng); });
  startGps();
}
function setLayer(k){ if(layers[curLayer]) map.removeLayer(layers[curLayer]); curLayer = k; layers[k].addTo(map); lsSet(LS.layer, k); $('#layerBtn').textContent = k === 'street' ? 'Satellite' : 'Street map'; }
function pinIcon(d){ const n = houseNo(d), s = ST[d.status] || ST.none;
  return L.divIcon({className:'', iconSize:[30,30], iconAnchor:[15,15], html:'<div class="pin s-'+esc(d.status)+(isDue(d) ? ' due' : '')+'">'+s.g+(n ? '<small>'+esc(n)+'</small>' : '')+'</div>'}); }
function drawPins(){
  if(!map) return;
  const c = counts();
  $('#legend').innerHTML = STATUS.map(s => '<button class="chip'+(S.hidden.has(s.k) ? ' off' : '')+'" data-act="toggle-status" data-k="'+s.k+'" aria-pressed="'+(!S.hidden.has(s.k))+'"><span class="sw s-'+s.k+'"></span>'+s.label+' <span class="n">'+c[s.k]+'</span></button>').join('');
  pinLayer.clearLayers();
  S.doors.forEach(d => { if(S.hidden.has(d.status)) return;
    L.marker([d.lat, d.lng], {icon:pinIcon(d), title:(d.address || 'Door') + ', ' + (ST[d.status] || ST.none).label, keyboard:true})
      .on('click', () => openDoor(d.id)).addTo(pinLayer); });
  if(draftMarker){ map.removeLayer(draftMarker); draftMarker = null; }
  if(S.sheet && S.sheet.isNew){ const d = S.sheet.door;
    draftMarker = L.marker([d.lat, d.lng], {interactive:false, icon:L.divIcon({className:'', iconSize:[30,30], iconAnchor:[15,15], html:'<div class="pin draft"></div>'})}).addTo(map); }
  $('#hint').hidden = S.doors.length > 0;
}
function startGps(){
  if(!navigator.geolocation) return;
  navigator.geolocation.watchPosition(p => {
    S.me = {lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy || 0};
    const ll = [S.me.lat, S.me.lng];
    if(!meMarker){ meCircle = L.circle(ll, {radius:S.me.acc, color:'#1A73E8', weight:1, fillOpacity:.12, interactive:false}).addTo(map);
      meMarker = L.marker(ll, {interactive:false, zIndexOffset:-100, icon:L.divIcon({className:'', iconSize:[18,18], iconAnchor:[9,9], html:'<div class="me"></div>'})}).addTo(map); }
    else { meMarker.setLatLng(ll); meCircle.setLatLng(ll); meCircle.setRadius(S.me.acc); }
    if(!S.moved){ S.moved = true; map.setView(ll, 18); }
  }, err => { S.gpsErr = err && err.code; }, {enableHighAccuracy:true, maximumAge:5000, timeout:20000});
}
function gpsHelp(){ return S.gpsErr === 1 ? 'Location is turned off for this page. Allow it in your browser settings, then reload.' : "Still finding your location. Make sure location is on and you're outside."; }

/* ---------- address lookup (OpenStreetMap, 1 request per second) ---------- */
let geoChain = Promise.resolve(), lastGeo = 0;
function geoQueue(fn){ geoChain = geoChain.then(async () => { const w = 1100 - (Date.now() - lastGeo); if(w > 0) await sleep(w); lastGeo = Date.now(); return fn(); }).catch(() => null); return geoChain; }
function reverseGeo(lat, lng){ return geoQueue(async () => {
  const r = await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&lat='+lat.toFixed(6)+'&lon='+lng.toFixed(6), {headers:{Accept:'application/json'}});
  if(!r.ok) return null; const a = (await r.json()).address || {};
  return [a.house_number, a.road || a.pedestrian || a.residential || a.path || ''].filter(Boolean).join(' ') || null; }); }
function fillAddress(id, lat, lng){
  reverseGeo(lat, lng).then(addr => { if(!addr) return;
    if(S.sheet && S.sheet.door.id === id){ const d = S.sheet.door; if(d.address) return; d.address = addr;
      const inp = $('#f-address'); if(inp && !inp.value) inp.value = addr; const h = $('#sh-title'); if(h) h.textContent = addr;
      if(!S.sheet.isNew){ putDoor(clone(d)); drawPins(); } else S.sheet.auto = true; }
    else { const d = S.doors.find(x => x.id === id); if(d && !d.address){ d.address = addr; putDoor(d); render(); } } });
}

/* ---------- views ---------- */
function render(){
  document.querySelectorAll('nav button').forEach(b => b.removeAttribute('aria-current'));
  $('nav button[data-view="'+S.view+'"]').setAttribute('aria-current', 'page');
  ['map','doors','stats','backup'].forEach(v => { $('#v-'+v).hidden = v !== S.view; });
  if(S.view === 'map'){ if(map){ drawPins(); map.invalidateSize(); } }
  else if(S.view === 'doors') renderDoors(); else if(S.view === 'stats') renderStats(); else renderBackup();
}
function renderDoors(){
  const el = $('#v-doors'), c = counts(), due = S.doors.filter(isDue).length;
  if(!$('#q')){ el.innerHTML = '<div class="wrap toolbar"><input id="q" type="search" placeholder="Search address, name or notes" aria-label="Search doors"></div><div class="legend wrap" id="lf"></div><div class="scroll"><div class="wrap" id="list"></div></div>'; $('#q').value = S.q; }
  const chip = (k, label, n, sw) => '<button class="chip'+(S.listFilter === k ? ' on' : '')+'" data-act="list-filter" data-k="'+k+'">'+(sw ? '<span class="sw s-'+k+'"></span>' : '')+label+' <span class="n">'+n+'</span></button>';
  $('#lf').innerHTML = chip('all','All',S.doors.length) + chip('due','Follow-ups due',due) + STATUS.map(s => chip(s.k, s.label, c[s.k], true)).join('');
  const q = S.q.trim().toLowerCase();
  let rows = S.doors.filter(d => S.listFilter === 'all' ? true : S.listFilter === 'due' ? isDue(d) : d.status === S.listFilter);
  if(q) rows = rows.filter(d => [d.address,d.name,d.phone,d.notes].join(' ').toLowerCase().includes(q));
  rows.sort((a,b) => (b.updated||0) - (a.updated||0));
  $('#list').innerHTML = rows.length ? rows.map(d => { const lv = lastVisit(d), s = ST[d.status] || ST.none;
    return '<button class="row" data-act="door" data-id="'+esc(d.id)+'"><span class="badge s-'+esc(d.status)+'">'+s.g+'</span><span class="body"><div class="t">'+esc(d.address || 'No address yet')+'</div>'
      + '<div class="m">'+s.label+(d.name ? ' · '+esc(d.name) : '')+(d.phone ? ' · '+esc(d.phone) : '')+(lv ? ' · '+fmtWhen(lv.t) : '')+'</div>'
      + (d.follow ? '<div class="m'+(isDue(d) ? ' due' : '')+'">Follow up '+esc(fmtDate(d.follow))+'</div>' : '')
      + (d.notes ? '<div class="m">'+esc(d.notes)+'</div>' : '')+'</span></button>'; }).join('')
    : '<div class="empty"><h2>'+(S.doors.length ? 'No doors match' : 'No doors yet')+'</h2><p>'+(S.doors.length ? 'Clear the search or pick another filter.' : 'Go to the Map tab and tap a house to log your first knock.')+'</p></div>';
}
function renderStats(){
  const c = counts(), td = today(); let kToday = 0, aToday = 0, kAll = 0, aAll = 0; const week = {};
  for(let i = 6; i >= 0; i--) week[dayKey(Date.now() - i*864e5)] = 0;
  S.doors.forEach(d => (d.visits || []).forEach(v => { if(!KNOCK.has(v.s)) return; const k = dayKey(v.t);
    kAll++; if(ANSWERED.has(v.s)) aAll++; if(k === td){ kToday++; if(ANSWERED.has(v.s)) aToday++; } if(k in week) week[k]++; }));
  const rate = kAll ? Math.round(aAll/kAll*100) + '%' : '–', max = Math.max(1, ...Object.values(week)), tot = Math.max(1, S.doors.length);
  const tile = (v, l) => '<div class="tile"><div class="v">'+v+'</div><div class="l">'+l+'</div></div>';
  $('#v-stats').innerHTML = '<div class="scroll"><div class="wrap"><div class="tiles">'
    + tile(kToday, 'Knocks today') + tile(aToday, 'Answered today') + tile(rate, 'Answer rate, all knocks')
    + tile(c.interested + c.callback, 'Open leads') + tile(c.sold, 'Sold') + tile(S.doors.filter(isDue).length, 'Follow-ups due') + '</div>'
    + '<h3 class="sec">Knocks, last 7 days</h3><div class="week">' + Object.entries(week).map(([k,n]) => { const [y,m,d] = k.split('-').map(Number);
        return '<div class="d"><span class="num">'+n+'</span><span class="col" style="height:'+Math.round(n/max*70)+'%"></span><span>'+new Date(y,m-1,d).toLocaleDateString([], {weekday:'short'})+'</span></div>'; }).join('') + '</div>'
    + '<h3 class="sec">Doors by status · '+S.doors.length+' pinned</h3><div class="bars">' + STATUS.map(s => '<div class="bar"><span>'+s.label+'</span><span class="track"><span class="fill s-'+s.k+'" style="width:'+(c[s.k]/tot*100)+'%"></span></span><span class="c">'+c[s.k]+'</span></div>').join('') + '</div></div></div>';
}
function renderBackup(){
  const lb = +lsGet(LS.backup) || 0, n = S.doors.length;
  const changed = S.doors.filter(d => (d.updated||0) > lb).length;
  $('#v-backup').innerHTML = '<div class="scroll"><div class="wrap">'
    + '<div class="card'+(changed ? ' warn' : '')+'"><h2>Your doors live on this phone</h2><p>Everything is saved in this browser on this device. It stays through closing the page and restarting the phone. Clearing browser data, or switching phones, loses it unless you have a backup file.</p>'
    + '<p><b>'+n+' door'+(n === 1 ? '' : 's')+' saved.</b> '+(lb ? 'Last backup '+fmtWhen(lb)+(changed ? ', and '+changed+' door'+(changed === 1 ? ' has' : 's have')+' changed since.' : '. Nothing has changed since.') : 'No backup yet.')+'</p>'
    + '<div class="actions"><button class="btn primary" data-act="backup">Download backup file</button><button class="btn" data-act="restore">Restore from a backup</button></div></div>'
    + '<div class="card"><h2>Spreadsheet export</h2><p>A CSV file with every door, its status, notes and visit count. Opens in Excel or Google Sheets.</p><div class="actions"><button class="btn" data-act="csv">Download CSV</button></div></div>'
    + '<div class="card"><h2>Keep it safe</h2><p>On iPhone, open this page in Safari, tap Share, then Add to Home Screen, and always open it from that icon. Download a backup after each day of knocking and keep the file in your cloud drive or email it to yourself.</p></div>'
    + '</div></div>';
}

/* ---------- door sheet ---------- */
function newDoor(lat, lng){
  const d = {id:uid(), lat, lng, status:'none', address:'', name:'', phone:'', notes:'', follow:'', visits:[], created:Date.now(), updated:Date.now()};
  S.sheet = {isNew:true, door:d}; openSheet(); drawPins(); fillAddress(d.id, lat, lng);
}
function openDoor(id){ const d = S.doors.find(x => x.id === id); if(!d) return; S.sheet = {isNew:false, door:clone(d)}; openSheet(); }
function openSheet(){ renderSheet(); document.body.classList.add('sheet-open'); $('#sheet').scrollTop = 0; }
function closeSheet(saveIt){
  const s = S.sheet; if(!s) return;
  if(saveIt !== false){ const d = s.door, typed = s.dirty && (d.address || d.name || d.phone || d.notes || d.follow);
    if(s.isNew ? (d.status !== 'none' || typed) : s.dirty) putDoor(d); }
  S.sheet = null; document.body.classList.remove('sheet-open'); render();
}
function renderSheet(){
  const s = S.sheet, d = s.door, lv = lastVisit(d);
  const sb = (k, wide) => '<button class="sbtn'+(wide ? ' wide' : '')+'" data-act="set-status" data-k="'+k+'" aria-pressed="'+(d.status === k)+'"><span class="g s-'+k+'">'+ST[k].g+'</span>'+ST[k].label+'</button>';
  $('#sheet').innerHTML = '<div class="sh-head"><div style="flex:1;min-width:0"><h2 id="sh-title">'+esc(d.address || (s.isNew ? 'New door' : 'Door'))+'</h2><p class="sh-sub">'+(lv ? 'Last visit: '+ST[lv.s].label+', '+fmtWhen(lv.t)+' · '+d.visits.length+' visit'+(d.visits.length === 1 ? '' : 's') : 'What happened at this door?')+'</p></div><button class="iconbtn" data-act="sheet-close">Close</button></div>'
    + '<div class="grp">Didn\'t answer</div><div class="sgrid">'+sb('noanswer', true)+'</div>'
    + '<div class="grp">Answered</div><div class="sgrid">'+sb('interested')+sb('notint')+sb('callback')+sb('sold')+'</div>'
    + '<div class="grp">Other</div><div class="sgrid">'+sb('dnk')+sb('none')+'</div>'
    + '<div class="field"><label for="f-address">Address</label><input id="f-address" data-f="address" autocomplete="off" placeholder="Looks it up from the pin, or type it" value="'+esc(d.address)+'"></div>'
    + '<div class="two"><div class="field"><label for="f-name">Name</label><input id="f-name" data-f="name" autocomplete="off" value="'+esc(d.name)+'"></div>'
    + '<div class="field"><label for="f-phone">Phone</label><input id="f-phone" data-f="phone" type="tel" inputmode="tel" autocomplete="off" value="'+esc(d.phone)+'"></div></div>'
    + '<div class="field"><label for="f-notes">Notes</label><textarea id="f-notes" data-f="notes" placeholder="Anything worth remembering">'+esc(d.notes)+'</textarea></div>'
    + '<div class="field"><label for="f-follow">Follow up on</label><input id="f-follow" data-f="follow" type="date" value="'+esc(d.follow)+'"></div>'
    + (d.visits.length ? '<div class="grp">Visit history</div><ul class="hist">'+d.visits.slice(-6).reverse().map(v => '<li><span class="sw s-'+esc(v.s)+'"></span>'+(ST[v.s] || ST.none).label+'<time>'+fmtWhen(v.t)+'</time></li>').join('')+'</ul>' : '')
    + '<div class="actions">'+(s.isNew ? '<button class="btn" data-act="sheet-discard">Cancel</button>'
        : '<button class="btn danger" data-act="door-delete">Delete pin</button><button class="btn" data-act="show-on-map">Show on map</button><a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+d.lat.toFixed(6)+','+d.lng.toFixed(6)+'">Directions</a>')
    + '<button class="btn primary" data-act="sheet-done">Done</button></div>';
}

/* ---------- files ---------- */
function download(name, text, type){ const url = URL.createObjectURL(new Blob([text], {type})), a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); }
function csv(){ const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  return ['Address,Name,Phone,Status,Last visit,Follow up,Visits,Notes,Latitude,Longitude'].concat(S.doors.map(d => { const lv = lastVisit(d);
    return [d.address, d.name, d.phone, (ST[d.status] || ST.none).label, lv ? new Date(lv.t).toLocaleString() : '', d.follow, d.visits.length, d.notes, d.lat.toFixed(6), d.lng.toFixed(6)].map(q).join(','); })).join('\n'); }
function restore(file){
  const fr = new FileReader();
  fr.onerror = () => toast("Couldn't read that file.");
  fr.onload = () => { let j; try{ j = JSON.parse(fr.result); }catch(e){ toast("That isn't a Knock Log backup file."); return; }
    const arr = Array.isArray(j) ? j : (j && Array.isArray(j.doors) ? j.doors : null);
    if(!arr){ toast("That isn't a Knock Log backup file."); return; }
    let added = 0, updated = 0;
    arr.filter(validDoor).map(normDoor).forEach(d => { const i = S.doors.findIndex(x => x.id === d.id);
      if(i < 0){ S.doors.push(d); added++; } else if((d.updated||0) > (S.doors[i].updated||0)){ S.doors[i] = d; updated++; } });
    save(); render(); toast('Restored: '+added+' added, '+updated+' updated. Nothing was removed.'); };
  fr.readAsText(file);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const nav = e.target.closest('nav button'); if(nav){ S.view = nav.dataset.view; render(); return; }
  const a = e.target.closest('[data-act]'); if(!a) return; const act = a.dataset.act;
  if(act === 'door') openDoor(a.dataset.id);
  else if(act === 'set-status'){ const s = S.sheet, d = s.door, k = a.dataset.k; d.status = k;
    if(k !== 'none'){ const v = {t:Date.now(), s:k}; if(s.logged) d.visits[d.visits.length-1] = v; else { d.visits.push(v); s.logged = true; } if(d.visits.length > 60) d.visits = d.visits.slice(-60); }
    else if(s.logged){ d.visits.pop(); s.logged = false; }
    if(!(s.isNew && k === 'none')){ putDoor(clone(d)); s.isNew = false; s.dirty = false; }
    renderSheet(); drawPins(); }
  else if(act === 'sheet-done' || act === 'sheet-close') closeSheet(true);
  else if(act === 'sheet-discard') closeSheet(false);
  else if(act === 'door-delete'){ if(!a.classList.contains('armed')){ a.classList.add('armed'); a.textContent = 'Tap again to delete for good'; } else { removeDoor(S.sheet.door.id); closeSheet(false); toast('Pin deleted.'); } }
  else if(act === 'show-on-map'){ const d = S.sheet.door; closeSheet(true); S.view = 'map'; S.hidden.delete(d.status); render(); map.setView([d.lat, d.lng], Math.max(map.getZoom(), 19)); }
  else if(act === 'toggle-status'){ const k = a.dataset.k; S.hidden.has(k) ? S.hidden.delete(k) : S.hidden.add(k); drawPins(); }
  else if(act === 'layer') setLayer(curLayer === 'street' ? 'satellite' : 'street');
  else if(act === 'locate'){ if(S.me){ S.moved = true; map.setView([S.me.lat, S.me.lng], Math.max(map.getZoom(), 18)); } else toast(gpsHelp()); }
  else if(act === 'pin-here'){ if(!S.me){ toast(gpsHelp()); return; }
    map.setView([S.me.lat, S.me.lng], Math.max(map.getZoom(), 19)); newDoor(S.me.lat, S.me.lng);
    if(S.me.acc > 25) toast('GPS is rough right now, about '+Math.round(S.me.acc)+' m. Check the pin is on the right house.'); }
  else if(act === 'list-filter'){ S.listFilter = a.dataset.k; renderDoors(); }
  else if(act === 'backup'){ if(!S.doors.length){ toast('No doors to back up yet.'); return; }
    download('knock-log-backup-'+today()+'.json', JSON.stringify({app:'knock-log', version:1, exported:Date.now(), doors:S.doors}), 'application/json'); lsSet(LS.backup, String(Date.now())); renderBackup(); }
  else if(act === 'restore') $('#restoreFile').click();
  else if(act === 'csv'){ if(!S.doors.length){ toast('No doors to export yet.'); return; } download('knock-log-'+today()+'.csv', csv(), 'text/csv'); }
});
document.addEventListener('input', e => {
  const f = e.target.dataset && e.target.dataset.f;
  if(f && S.sheet){ S.sheet.door[f] = e.target.value; S.sheet.dirty = true; return; }
  if(e.target.id === 'q'){ S.q = e.target.value; renderDoors(); }
});
$('#restoreFile').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if(f) restore(f); e.target.value = ''; });
$('#find').addEventListener('submit', e => { e.preventDefault(); const q = $('#findq').value.trim(); if(!q) return;
  geoQueue(async () => { const r = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='+encodeURIComponent(q), {headers:{Accept:'application/json'}});
    if(!r.ok) return null; const j = await r.json(); return j && j[0] ? j[0] : null; })
  .then(hit => { if(!hit){ toast("Couldn't find that place. Try adding the city and state."); return; }
    S.moved = true; S.view = 'map'; render(); map.setView([+hit.lat, +hit.lon], 17); $('#findq').blur(); }); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && S.sheet) closeSheet(true); });

load();
if(window.L){ initMap(); render(); if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); }
else { $('#mapbox').innerHTML = '<div class="empty"><h2>The map didn\'t load</h2><p>Check your connection and reload. Your saved doors are safe and still show under Doors.</p></div>';
 }
</script>
</body>
</html>
